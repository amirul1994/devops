apiVersion: batch/v1
kind: Job
metadata:
  name: vault-certs-generator
  namespace: vault

spec:
  backoffLimit: 3

  template:
    spec:
      serviceAccountName: vault-cert-generator
      automountServiceAccountToken: true
      restartPolicy: OnFailure

      containers:
        - name: certgen
          image: alpine:latest

          command:
            - /bin/sh
            - -c
            - |
              # Install OpenSSL and kubectl
              apk add --no-cache openssl curl

              curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
              chmod +x kubectl
              mv kubectl /usr/local/bin/

              # Generate CA certificate
              openssl genrsa -out ca.key 2048

              openssl req \
                -new \
                -x509 \
                -days 365 \
                -key ca.key \
                -out ca.crt \
                -subj "/C=US/ST=State/L=City/O=Vault/CN=vault-ca"

              # Generate server key
              openssl genrsa -out server.key 2048

              # Create CSR configuration with SANs
              cat > csr.cnf <<'EOF'
              [req]
              default_bits = 2048
              prompt = no
              default_md = sha256
              distinguished_name = dn

              [dn]
              C = US
              ST = State
              L = City
              O = Vault
              CN = vault.vault.svc.cluster.local

              [v3_req]
              subjectAltName = @alt_names

              [alt_names]
              DNS.1 = vault.vault.svc.cluster.local
              DNS.2 = vault.vault.svc
              DNS.3 = vault-0.vault.vault.svc.cluster.local
              DNS.4 = vault-1.vault.vault.svc.cluster.local
              DNS.5 = vault-2.vault.vault.svc.cluster.local
              DNS.6 = localhost
              IP.1 = 127.0.0.1
              EOF

              # Generate CSR and sign certificate
              openssl req \
                -new \
                -key server.key \
                -out server.csr \
                -config csr.cnf

              openssl x509 \
                -req \
                -days 365 \
                -in server.csr \
                -CA ca.crt \
                -CAkey ca.key \
                -CAcreateserial \
                -out server.crt \
                -extensions v3_req \
                -extfile csr.cnf

              # Create/update Kubernetes secrets
              kubectl create secret generic vault-ca \
                --namespace=vault \
                --from-file=ca.crt \
                --dry-run=client \
                -o yaml | kubectl apply -f -

              kubectl create secret generic vault-tls \
                --namespace=vault \
                --from-file=server.crt \
                --from-file=server.key \
                --dry-run=client \
                -o yaml | kubectl apply -f -

              echo "Certificates generated successfully"